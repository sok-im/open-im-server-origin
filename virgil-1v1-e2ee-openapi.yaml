openapi: 3.0.3
info:
  title: VirgilSecurity 1v1 E2EE API
  version: 1.0.0
  description: |
    OpenAPI spec for VirgilSecurity-based 1v1 end-to-end encryption.
    Service only stores and routes ciphertext; plaintext and private keys are client-side only.
    Message send/pull/ack and 1v1 conversationID are reused from existing OpenIM IM APIs
    (getOneConversation). Device lists are fetched via GET /v1/e2ee/devices before each send;
    no device-change push is used.

servers:
  - url: /api/im-e2ee
    description: Relative server URL

tags:
  - name: Virgil
    description: Virgil JWT related APIs
  - name: Devices
    description: Device and card management APIs
  - name: Files
    description: Encrypted file upload helper APIs

security:
  - bearerAuth: []

paths:
  /v1/virgil/jwt:
    post:
      tags: [Virgil]
      summary: Issue short-lived Virgil JWT
      description: |
        Issues a short-lived Virgil JWT bound to current user and device.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueVirgilJwtRequest'
      responses:
        '200':
          description: Virgil JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueVirgilJwtResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenDeviceRevoked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/e2ee/devices/register:
    post:
      tags: [Devices]
      summary: Register device and bind Virgil card
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDeviceResponse'
        '200':
          description: Idempotent replay
          headers:
            X-Idempotent-Replay:
              $ref: '#/components/headers/XIdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDeviceResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/e2ee/devices:
    get:
      tags: [Devices]
      summary: Query active devices for a user (call before every E2EE send)
      description: |
        Authoritative source for peer active devices. Client MUST call this before encrypting
        and sending each E2EE message (no device-change WebSocket push). Returns only active
        devices when includeRevoked=false.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequestId'
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: includeRevoked
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Device list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDevicesResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/e2ee/devices/revoke:
    post:
      tags: [Devices]
      summary: Revoke a device
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeDeviceRequest'
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeDeviceResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/e2ee/files/upload-url:
    post:
      tags: [Files]
      summary: Get signed URL for encrypted file upload
      description: |
        Client obtains OpenIM 1v1 conversationID via existing IM API
        (conversationManager.getOneConversation) before calling this endpoint.
        Upload body must be ciphertext only; fileKey is distributed via E2EE custom message.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadUrlRequest'
      responses:
        '200':
          description: Signed URLs created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUploadUrlResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    XIdempotentReplay:
      description: true when response is returned from idempotency replay
      schema:
        type: string
        enum: ['true']

  parameters:
    XDeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
      description: Current request device ID
    XRequestId:
      name: X-Request-Id
      in: header
      required: true
      schema:
        type: string
      description: Request trace ID
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Optional idempotency key for write APIs

  responses:
    InvalidArgument:
      description: Bad request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_ARGUMENT
            message: invalid request parameters
            requestId: req_01JABC
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: unauthorized
            requestId: req_01JABC
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: forbidden
            requestId: req_01JABC
    ForbiddenDeviceRevoked:
      description: Device revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN_DEVICE_REVOKED
            message: device revoked
            requestId: req_01JABC
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: resource not found
            requestId: req_01JABC
    Conflict:
      description: Conflict / idempotency conflict / duplicate
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: IDEMPOTENCY_CONFLICT
            message: same idempotency key with different payload
            requestId: req_01JABC
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RATE_LIMITED
            message: too many requests
            requestId: req_01JABC
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: internal error
            requestId: req_01JABC

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true

    IssueVirgilJwtRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId:
          type: string
        tokenTtlSec:
          type: integer
          minimum: 60
          maximum: 3600
          default: 600

    IssueVirgilJwtResponse:
      type: object
      required: [virgilJwt, identity, expiresAt]
      properties:
        virgilJwt:
          type: string
        identity:
          type: string
          description: userId:deviceId
        expiresAt:
          type: string
          format: date-time

    RegisterDeviceRequest:
      type: object
      required: [deviceId, cardId, platform]
      properties:
        deviceId:
          type: string
        cardId:
          type: string
        platform:
          type: string
          enum: [ios, android, web, desktop]
        clientVersion:
          type: string

    RegisterDeviceResponse:
      type: object
      required: [userId, deviceId, cardId, status, registeredAt]
      properties:
        userId:
          type: string
        deviceId:
          type: string
        cardId:
          type: string
        status:
          type: string
          enum: [active, revoked]
        registeredAt:
          type: string
          format: date-time

    DeviceItem:
      type: object
      required: [deviceId, cardId, platform, status]
      properties:
        deviceId:
          type: string
        cardId:
          type: string
        platform:
          type: string
          enum: [ios, android, web, desktop]
        status:
          type: string
          enum: [active, revoked]
        lastSeenAt:
          type: string
          format: date-time

    GetDevicesResponse:
      type: object
      required: [userId, devices, version]
      properties:
        userId:
          type: string
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceItem'
        version:
          type: integer
          format: int64

    RevokeDeviceRequest:
      type: object
      required: [deviceId, reason]
      properties:
        deviceId:
          type: string
        reason:
          type: string
          enum: [lost, stolen, logout, security]

    RevokeDeviceResponse:
      type: object
      required: [deviceId, status, revokedAt]
      properties:
        deviceId:
          type: string
        status:
          type: string
          enum: [revoked]
        revokedAt:
          type: string
          format: date-time

    RecipientEncKey:
      type: object
      required: [deviceId, encKey]
      properties:
        deviceId:
          type: string
        encKey:
          type: string
          description: base64 encrypted content key for that device

    CipherEnvelope:
      type: object
      description: |
        E2EE ciphertext envelope to be carried in existing OpenIM sendMessage custom payload
        (e.g. customElem.data JSON string). This spec does not redefine sendMessage endpoint.
      required: [v, alg, senderUserId, senderDeviceId, ciphertext, recipients, sign, msgType]
      properties:
        v:
          type: integer
          minimum: 1
        alg:
          type: string
          example: virgil-e3kit-v1
        senderUserId:
          type: string
        senderDeviceId:
          type: string
        ciphertext:
          type: string
          description: base64 ciphertext payload
        recipients:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipientEncKey'
        sign:
          type: string
          description: base64 signature by sender device private key
        msgType:
          type: string
          enum: [text, file_meta, image_meta, custom]

    CreateUploadUrlRequest:
      type: object
      required: [size, contentType, openIMConversationID, peerUserId]
      properties:
        size:
          type: integer
          format: int64
          minimum: 1
          description: Encrypted file size in bytes
        contentType:
          type: string
          example: application/octet-stream
          description: MIME type of ciphertext blob
        openIMConversationID:
          type: string
          description: |
            OpenIM single-chat conversationID from getOneConversation(sourceID, sessionType=1).
            Not an E2EE-specific conversation id.
        peerUserId:
          type: string
          description: 1v1 peer userId; server validates it matches the conversation

    CreateUploadUrlResponse:
      type: object
      required: [uploadUrl, downloadUrl, fileRefId, expiresAt]
      properties:
        uploadUrl:
          type: string
          format: uri
        downloadUrl:
          type: string
          format: uri
        fileRefId:
          type: string
        expiresAt:
          type: string
          format: date-time

