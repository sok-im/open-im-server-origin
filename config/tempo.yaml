server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:14317
        http:
          endpoint: 0.0.0.0:14318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # Trace retention (default 7d). Override via TEMPO_BLOCK_RETENTION if rebuilding config.
    block_retention: 168h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
