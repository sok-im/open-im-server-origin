rpc:
  registerIP: ""
  listenIP: 0.0.0.0
  autoSetPorts: false
  ports: [10560]

prometheus:
  enable: false
  ports: [12560]

# Multi-chain runtime configuration.
# Frontend should select one chainKey per environment, for example:
#   eth-sepolia / bsc-testnet / tron-nile
chains:
  ethereum@testnet:
    chainType: EVM
    chainID: 11155111
    isTestnet: true
    # Native coin ticker. Required per chain because chainType=EVM covers many
    # chains with different native coins; empty falls back to ETH (EVM) / TRX (TRON).
    nativeSymbol: ETH
    rpcURL: "https://ethereum-sepolia-rpc.publicnode.com"
    contractAddress: "0x5F1D92a7b421907b640a038B5C9C725bCD3498BC"
    signerPrivateKey: "e9f6a5f3a3c3a97099ca31e7f44151e529c0a4f8a91d5d4232c7282f2b798df4"
    configAdminPrivateKey: "e9f6a5f3a3c3a97099ca31e7f44151e529c0a4f8a91d5d4232c7282f2b798df4"

  bsc@testnet:
    chainType: EVM
    chainID: 97
    isTestnet: true
    nativeSymbol: BNB
    rpcURL: "https://data-seed-prebsc-1-s1.bnbchain.org:8545"
    contractAddress: "0x9f2e22F5D0cf8d8127E319D38b3EDDaE43bb4DC0"
    signerPrivateKey: "e9f6a5f3a3c3a97099ca31e7f44151e529c0a4f8a91d5d4232c7282f2b798df4"
    configAdminPrivateKey: "e9f6a5f3a3c3a97099ca31e7f44151e529c0a4f8a91d5d4232c7282f2b798df4"

  tron@testnet:
    chainType: TRON
    chainID: 3448148188
    isTestnet: true
    nativeSymbol: TRX
    fullNodeURL: "https://nile.trongrid.io"
    contractBase58: "TTLFvSEyH6BAUp3cVGygWyTVGPBqdLw81M"
    ownerBase58: "TJG6ZbEUZNVAQzFQTZehfQJniVJtTBdZ2e"
    privateKeyHex: "e9f6a5f3a3c3a97099ca31e7f44151e529c0a4f8a91d5d4232c7282f2b798df4"
    feeLimit: 150000000

  ethereum@mainnet:
    chainType: EVM
    chainID: 1
    isTestnet: false
    nativeSymbol: ETH
    # 正式发布建议换成自有/付费节点（Alchemy / Infura / QuickNode 等）
    rpcURL: "https://ethereum-rpc.publicnode.com"
    contractAddress: "0xA1f42567559aBA5Ff0aac84cdE1AaF1F9DbB888F"
    # 【需你填】= keys.env 的 SIGNER_PRIVATE_KEY（对应链上 signer 0xEEaD5bAB…ba9c）
    signerPrivateKey: "340937a4edc4502b3e9fe34022045b4b7954c660db46bc15f584ad099c4c6d8f"
    # 【需你填】= keys.env 的 CONFIG_ADMIN_PRIVATE_KEY（对应 0x1D81A16f…1597）
    configAdminPrivateKey: "705dbfb2e3257dc8cfc5fb0537ea4150cdf43f3ad346f50f5efa8643154632ad"

  bsc@mainnet:
    chainType: EVM
    chainID: 56
    isTestnet: false
    nativeSymbol: BNB
    rpcURL: "https://bsc-dataseed3.bnbchain.org"
    contractAddress: "0xA1f42567559aBA5Ff0aac84cdE1AaF1F9DbB888F"
    # 【需你填】= keys.env 的 SIGNER_PRIVATE_KEY（对应 signer 0xEEaD5bAB…ba9c）
    signerPrivateKey: "340937a4edc4502b3e9fe34022045b4b7954c660db46bc15f584ad099c4c6d8f"
    # 【需你填】= keys.env 的 CONFIG_ADMIN_PRIVATE_KEY（对应 0x1D81A16f…1597）
    configAdminPrivateKey: "705dbfb2e3257dc8cfc5fb0537ea4150cdf43f3ad346f50f5efa8643154632ad"

  tron@mainnet:
    chainType: TRON
    chainID: 728126428
    isTestnet: false
    nativeSymbol: TRX
    fullNodeURL: "https://api.trongrid.io"
    contractBase58: "THTS5CQtGvjDfuN51HgM53xR4vKjzascMB"
    # 配置管理员地址（公开，非私钥）：0x1D81… 的 TRON 形式
    ownerBase58: "TCfDtWoYhWwqRAE4Ji8omtqyeJygnsbGhx"
    # 【需你填】TRON signer 私钥 = keys.env 的 SIGNER_PRIVATE_KEY，去掉开头的 0x（对应 signer TXjDVqyG…Mnm）
    privateKeyHex: "340937a4edc4502b3e9fe34022045b4b7954c660db46bc15f584ad099c4c6d8f"
    feeLimit: 1500000000

# Legacy single-chain fields are still supported as a fallback during migration.
chain:
  rpcURL: ""
  contractAddress: ""
  chainID: 0
  signerPrivateKey: ""
  configAdminPrivateKey: ""

tron:
  fullNodeURL: ""
  contractBase58: ""
  ownerBase58: ""
  privateKeyHex: ""
  feeLimit: 150000000

# Indexer polling interval (in seconds). Used by both EVM and TRON event indexers.
# Set to 0 or negative to disable block scanning completely and rely on tx-hash parsing paths.
indexer:
  pollInterval: 0
  # EVM only: max block span per eth_getLogs request (0 = default 2000). Increase if your node allows larger ranges.
  maxBlocksPerPoll: 2000
