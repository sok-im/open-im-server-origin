# Local/dev Alertmanager: null receiver (no SMTP required).
# To enable email, set smtp_* below and switch default receiver to "email".
global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/email.tmpl

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: null
  routes:
    - matchers:
        - severity = "critical"
      receiver: null
      continue: false
    - matchers:
        - severity = "warning"
      receiver: null
      continue: false

receivers:
  - name: 'null'
  # Uncomment and fill SMTP credentials to enable email alerts:
  # - name: email
  #   email_configs:
  #     - to: 'alert@example.com'
  #       from: alert@openim.io
  #       smarthost: smtp.example.com:465
  #       auth_username: alert@openim.io
  #       auth_password: YOURAUTHPASSWORD
  #       require_tls: false
  #       html: '{{ template "email.to.html" . }}'
  #       headers: { Subject: "[OPENIM-SERVER]Alarm" }
  #       send_resolved: true

inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ['alertname', 'job', 'instance']
