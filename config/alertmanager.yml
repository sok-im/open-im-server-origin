# Alertmanager: email disabled. All alerts go to the null receiver (no SMTP).
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'null'
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'null'
      continue: false
    - matchers:
        - severity = "warning"
      receiver: 'null'
      continue: false

receivers:
  - name: 'null'

inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ['alertname', 'job', 'instance']
