port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # 关闭 STUN 自动探测外网 IP，避免容器内 DNS（127.0.0.53）不可用时启动失败反复重启。
  # 真机/跨网段访问时须填写宿主机可达 IP，与 openim-rpc-rtc.yml 中 externalAddress 一致。
  use_external_ip: false
  node_ip: 10.18.1.11

redis:
  address: redis:6379
  password: openIM123

# LiveKit 要求 API secret 至少 32 字符；生产环境请替换为强随机串并与 openim-rpc-rtc.yml 中 apiSecret 一致
keys:
  devkey: openim-livekit-default-secret-32chars-min

logging:
  level: info

# Optional: fast-path for the rtc call watchdog (see openim-rpc-rtc.yml
# watchdog.webhookEnabled). Uncomment and point at the api gateway's
# /rtc/livekit_webhook route (reachable from the LiveKit server) to let
# room_finished/participant_left events trigger an immediate stale-call
# re-check instead of waiting for the next periodic scan.
# webhook:
#   api_key: devkey
#   urls:
#     - http://openim-api:10002/rtc/livekit_webhook
