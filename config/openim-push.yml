rpc:
  # The IP address where this RPC service registers itself; if left blank, it defaults to the internal network IP
  registerIP:
  # IP address that the RPC service listens on; setting to 0.0.0.0 listens on both internal and external IPs. If left blank, it automatically uses the internal network IP
  listenIP: 0.0.0.0
  # autoSetPorts indicates whether to automatically set the ports
  autoSetPorts: true
  # List of ports that the RPC service listens on; configuring multiple ports will launch multiple instances. These must match the number of configured prometheus ports
  # It will only take effect when autoSetPorts is set to false.
  ports: [ 10170, 10171, 10172, 10173, 10174, 10175, 10176, 10177, 10178, 10179, 10180, 10181, 10182, 10183, 10184, 10185 ]

prometheus:
  # Enable or disable Prometheus monitoring
  enable: true
  # List of ports that Prometheus listens on; these must match the number of rpc.ports to ensure correct monitoring setup
  # It will only take effect when autoSetPorts is set to false.
  ports: [ 12170, 12171, 12172, 12173, 12174, 12175, 12176, 12177, 12178, 12179, 12180, 12182, 12183, 12184, 12185, 12186 ]

maxConcurrentWorkers: 3
# Use geTui, fcm, jpush, or engagelab for offline push notifications; corresponding configuration settings must be specified.
enable: engagelab
geTui:
  pushUrl: https://restapi.getui.com/v2/$appId
  masterSecret:
  appKey:
  intent:
  channelID:
  channelName:
fcm:
  # Prioritize using file paths. If the file path is empty, use URL
  filePath: sokim-firebase-adminsdk.json  # File path is concatenated with the parameters passed in through - c(`mage` default pass in `config/`) and filePath.
  authURL:   #  Must start with https or http.
jpush:
  appKey:
  masterSecret:
  pushURL:
  pushIntent:
engagelab:
  appKey:
  masterSecret:
  # Data center base URL (no path suffix). Available options:
  #   Singapore (default): https://pushapi-sgp.engagelab.com
  #   Hong Kong:           https://pushapi-hk.engagelab.com
  #   Virginia:            https://pushapi-usva.engagelab.com
  #   Frankfurt:           https://pushapi-defra.engagelab.com
  # Leave blank to use the Singapore data center.
  pushURL:
  pushIntent:

# iOS push options (used by EngageLab as APNSProduction in push requests)
iosPush:
  pushSound: default
  badgeCount: true
  # false: APNS sandbox (Xcode debug / development certificate)
  # true:  APNS production (App Store / TestFlight / production certificate)
  production: true

fullUserCache: true
