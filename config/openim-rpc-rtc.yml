rpc:
  # The IP address where this RPC service registers itself; if left blank, it defaults to the internal network IP
  registerIP:
  # IP address that the RPC service listens on; setting to 0.0.0.0 listens on both internal and external IPs. If left blank, it automatically uses the internal network IP
  listenIP: 0.0.0.0
  # autoSetPorts indicates whether to automatically set the ports
  autoSetPorts: true
  # List of ports that the RPC service listens on; configuring multiple ports will launch multiple instances.
  # It will only take effect when autoSetPorts is set to false.
  ports: [ 10400 ]

prometheus:
  # Enable or disable Prometheus monitoring
  enable: true
  # List of ports that Prometheus listens on; these must match the number of rpc.ports.
  # It will only take effect when autoSetPorts is set to false.
  ports: [ 12400 ]

liveKit:
  # RTC 进程访问 LiveKit HTTP API（CreateRoom 等）。本机跑 openim-rpc-rtc、LiveKit 映射 7880 时用 127.0.0.1。
  # 与 livekit 容器同 Docker 网络时用 http://livekit:7880。也可用环境变量 OPENIM_LIVEKIT_INTERNAL_ADDRESS 覆盖。
  internalAddress: http://127.0.0.1:7880
  # 下发给客户端的 WebSocket（liveURL）。真机填本机局域网 IP；也可用 OPENIM_LIVEKIT_EXTERNAL_ADDRESS 覆盖。
  externalAddress: ws://10.18.1.11:7880
  # LiveKit API key (configured in your LiveKit server)
  apiKey: devkey
  # LiveKit API secret（须 ≥32 字符，须与 config/livekit.yaml keys 中对应值一致）
  apiSecret: openim-livekit-default-secret-32chars-min
  # Token expiry in seconds (default: 3600 = 1 hour)
  tokenExpiry: 3600
  # E2EE room JWT TTL in seconds (≤ 300). Short TTL because LiveKit JWTs are not revocable.
  e2eeTokenExpiry: 300

# Call E2EE capability allow-list (token gating only when invitation e2ee.required=true).
e2ee:
  allowedSchemes: ["mls-exporter-livekit-v1"]
  minVersion: 1

# Per-user call-status Redis TTL in seconds (default: 10).
# Acts as a safety net so users are not stuck in "connecting"/"in-call" after crashes;
# clients should heartbeat during active calls to refresh this TTL.
callStatusTTL: 10
