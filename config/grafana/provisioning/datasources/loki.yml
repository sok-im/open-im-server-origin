apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://127.0.0.1:3100
    editable: true
    jsonData:
      derivedFields:
        # Prefer W3C trace id when present in JSON logs
        - datasourceUid: tempo
          matcherRegex: "\"traceID\"\\s*:\\s*\"([0-9a-fA-F]{32})\""
          name: TraceID
          url: "$${__value.raw}"
        # Fallback: jump to Tempo Explore with operationID as query hint text
        - datasourceUid: tempo
          matcherRegex: "\"operationID\"\\s*:\\s*\"([^\"]+)\""
          name: OperationID
          url: "$${__value.raw}"
          urlDisplayLabel: "Search Trace by OperationID"
